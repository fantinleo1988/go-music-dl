name: Build diário

on: [push, pull_request]

env:
  BINARY_PREFIX: "music-dl_"
  BINARY_SUFFIX: ""
  PR_PROMPT: "::warning:: O upload do artefato de build não será feito porque o workflow foi acionado por um pull request."
  LD_FLAGS: "-w -s"

jobs:
  build:
    name: CI de build do binário
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # build e publicação em paralelo: linux/386, linux/amd64, windows/386, windows/amd64, darwin/amd64, darwin/arm64
        goos: [linux, windows]
        goarch: ["386", amd64, arm, arm64]
        exclude:
          - goos: windows
            goarch: arm
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: 386
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar ambiente Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Fazer cache do módulo baixado
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
      - name: Fazer o build do arquivo binário
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          IS_PR: ${{ !!github.head_ref }}
        run: |
          # Garante que está no diretório raiz do projeto
          pwd
          ls -la
          # Verifica se o diretório cmd/music-dl existe
          if [ ! -d "./cmd/music-dl" ]; then
            echo "::error:: Faltando diretório cmd/music-dl, por favor verifique o commit do código"
            echo "Conteúdo do diretório atual:"
            find . -type f -name "*.go" | head -20
            exit 1
          fi
          # Inicializa o módulo Go e baixa as dependências
          go mod tidy
          go mod download
          # Gera os arquivos de recurso do Windows
          GOOS= GOARCH= go generate ./...
          if [ $GOOS = "windows" ]; then export BINARY_SUFFIX="$BINARY_SUFFIX.exe"; fi
          if $IS_PR ; then echo $PR_PROMPT; fi
          export BINARY_NAME="$BINARY_PREFIX$GOOS_$GOARCH$BINARY_SUFFIX"
          export CGO_ENABLED=0
          go build -o "output/$BINARY_NAME" -trimpath -ldflags "$LD_FLAGS" ./cmd/music-dl
      - name: Fazer upload do artefato
        uses: actions/upload-artifact@v4
        if: ${{ !github.head_ref }}
        with:
          name: ${{ matrix.goos }}_${{ matrix.goarch }}
          path: output/

